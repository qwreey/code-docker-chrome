[supervisord]
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# One [program:...] file per process, matching roblox-studio-docker and code-docker's
# own split. No second gitignored override glob: this image has no user-override
# mechanism anywhere else either, and anything a user wants to add belongs in
# code-docker's on-volume supervisord directory, not in this container.
[include]
files = /etc/code-docker-chrome/supervisord.d/*.conf
