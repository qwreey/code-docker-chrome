# No ordering dependency on chromium beyond priority: cdp-wrap is a plain reverse proxy,
# so before Chrome's debugging port exists it just answers 502 and Go's transport
# re-dials on the next request. That also means a Chrome restart needs no action here.
[program:cdp-wrap]
command=/etc/code-docker-chrome/cdp-wrap-service.sh
priority=45
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
