# priority=10 - before labwc, whose post-start step pushes WAYLAND_DISPLAY into the
# session bus's activation environment and therefore needs a live bus.
#
# autorestart=false + startretries=0: a first failure should surface to
# critical-watchdog immediately rather than being quietly retried. See that program.
[program:dbus]
command=/etc/code-docker-chrome/dbus-service.sh
priority=10
autorestart=false
startretries=0
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
