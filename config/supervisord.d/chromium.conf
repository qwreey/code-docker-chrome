# autorestart=true, and deliberately NOT in critical-watchdog's list: unlike labwc or
# wayvnc, Chrome quitting is an ordinary thing for a person at the VNC session to do
# (closing the last window, or Chrome's own crash-restart). Bringing it straight back
# is what "there is always a browser here" means; tearing the container down over it
# would make the GUI a trap. A compositor dying, by contrast, leaves nothing to fix
# from the inside.
[program:chromium]
command=/etc/code-docker-chrome/chromium-service.sh
priority=40
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
