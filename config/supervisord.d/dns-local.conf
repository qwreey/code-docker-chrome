# priority=5 - before anything that resolves a name. Chrome obviously needs DNS, but so
# does cdp-wrap (CDP_BIND_ALIAS) and wayvnc (VNC_BIND_ALIAS), and both fail closed.
[program:dns-local]
command=/etc/code-docker-chrome/dns-local-service.sh
priority=5
autorestart=true
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
