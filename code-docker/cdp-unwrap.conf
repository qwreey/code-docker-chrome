; Installed by install.sh into code-docker's on-volume unit directory
; (/code/.local/share/code-docker/supervisord/), which is the include glob that can
; gain a program without rebuilding the code-docker image.
;
; This is the code-docker half of the CDP tunnel: it listens on loopback, attaches the
; bearer token, and forwards to cdp-wrap in the chrome container. Because the Host
; header is passed through untouched, Chrome reports its webSocketDebuggerUrl as
; ws://127.0.0.1:9222/... - pointing back here - so chrome-devtools-mcp needs no
; awareness that the browser is in another container.
;
; Loopback-only bind is deliberate: the token lives in this container's environment, so
; anything that can reach this port already has it.
[program:cdp-unwrap]
command=/code/.local/bin/cdp-bridge unwrap -listen 127.0.0.1:9222 -upstream chrome-cdp:9223
autorestart=true
startsecs=2
stdout_logfile=/var/log/%(program_name)s/stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/%(program_name)s/stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
