# The only compose file in this repo, on purpose.
#
# roblox-studio-docker keeps a standalone docker-compose.yml and layers this kind of
# overlay on top, because Roblox Studio in a container is a thing worth having on its
# own. Chrome in a container is not - there are several good ones already. This image
# exists solely to attach a browser to code-docker, so there is nothing to opt out of
# and no second compose file to keep in sync.
#
# It is pulled in through code-docker's extra-include.yml -> EXTRA_INCLUDE hook, which
# `ootb.sh` writes from ootb-manifest.env. Running this file on its own is not
# supported: code-docker-internal and code-docker-router are defined only in
# code-docker's own docker-compose.yml.

services:
  code-docker-chrome:
    build:
      # `.`, not a variable. Compose resolves a relative path in an *included*
      # fragment against that fragment's own directory, and this file always sits in
      # the repo root - so `.` is correct wherever ootb clones the repo, and there is
      # nothing for a deployment to configure. Measured: a marker value `./ZZZ` here
      # resolves to <this repo>/ZZZ, not <deploy dir>/ZZZ.
      context: .
    # Every other container in this stack pins its name, and this one is the one people
    # will reach for with `docker logs` when the browser misbehaves. Nothing depends on
    # it for addressing - the CDP and VNC paths both use network aliases, so the name is
    # purely for humans.
    container_name: "${PREFIX:-}code-docker-chrome"
    restart: unless-stopped
    # Chrome dies in confusing ways on Docker's default 64MB /dev/shm - every
    # chrome-in-docker image documents this.
    shm_size: "1gb"
    # No capabilities. Routing is planted from outside by netinit-docker, which is the
    # whole reason that agent lives on the host side.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Opt-in label that makes code-docker's host-side netinit-docker agent manage this
    # container's egress. Where the gateway is comes from the *network* side
    # (code-docker-internal's netinit.gateway label in code-docker's own compose), not
    # from here - so a container on several networks needs nothing extra, and a network
    # that declares no gateway (chrome-vnc below) never becomes an egress path.
    # Matching is fail-closed: no label, no agent touches it. chrome-net is the network
    # that declares the gateway now.
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
    environment:
      # Shared secret for the CDP tunnel. cdp-bridge refuses to start on an empty value
      # rather than accepting every caller (wrap) or sending a blank header that reads
      # as an unexplained 401 (unwrap). ootb generates it - see ootb-manifest.env.
      CHROME_CDP_TOKEN: "${CHROME_CDP_TOKEN:?CHROME_CDP_TOKEN is required - run ootb.sh/migrate.sh, or set it in code-docker's .env}"
      # Bind each listener to exactly one network. Both resolve through getent and fail
      # closed; see config/supervisor/resolve-bind-alias.sh. cdp-wrap listens on
      # chrome-net, where only chrome-front (relaying from code-docker) can reach it.
      CDP_BIND_ALIAS: chrome-browser
      VNC_BIND_ALIAS: chrome-vnc
      # Chrome resolves localhost to chrome-front, so http://localhost:<port> reaches a
      # dev server on code-docker or dind once that port is in chrome-front's forward
      # table (chrome-front/main.go, chromium-service.sh).
      CHROME_LOCALHOST_HOST: chrome-front
      SCREEN_SIZE: "${CHROME_SCREEN_SIZE:-1920x1080}"
      CHROME_START_URL: "${CHROME_START_URL:-about:blank}"
      # Compose forwards nothing it is not told to. Both of these are read by the
      # service scripts and documented in .env.example, so leaving them out meant a
      # user who set VNC_PASSWORD got an unauthenticated wayvnc with no error at all.
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      CHROME_EXTRA_ARGS: "${CHROME_EXTRA_ARGS:-}"
    networks:
      # Not code-docker-internal: Chrome runs arbitrary sites' JavaScript, and there
      # code-docker's nginx (code-server, webmanager with its opt-in login) and dind's
      # unauthenticated API answer. Chrome's own network has only router (gateway),
      # chrome-front (the one bridge) and Chrome. The alias is what cdp-wrap binds to
      # and what chrome-front relays CDP to; it exists on this network only.
      chrome-net:
        aliases:
          - chrome-browser
      # VNC is the opposite shape - a subtraction. Only router joins, so the agent
      # container cannot reach the screen at all, and a person gets there through
      # router's VNC tab. Same "the border is router's alone" rule
      # roblox-studio-docker's VNC isolation follows.
      chrome-vnc:
        aliases:
          - chrome-vnc
    volumes:
      # The Chrome profile - logins, cookies, extensions. Named rather than a host path
      # because relative paths in an included file resolve against *this* file's
      # directory, which is a footgun in a repo that is only ever included.
      - chrome-profile:/data/profile

  # The one bridge between chrome-net and code-docker-internal: CDP from code-docker to
  # Chrome, dev-server ports from Chrome to code-docker/dind, and the forward table's API
  # and page. All in chrome-front/main.go's header comment.
  chrome-front:
    build:
      context: ./chrome-front
    container_name: "${PREFIX:-}code-docker-chrome-front"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # This container's address on each network, network-qualified so the answer can't
      # be its address on the other one (Docker's DNS answers <container>.<network>).
      # The API and the CDP relay bind the first; the forwards bind the second.
      FRONT_INTERNAL_NAME: "${PREFIX:-}code-docker-chrome-front.${PREFIX:-}code-docker-internal"
      FRONT_CHROME_NAME: "${PREFIX:-}code-docker-chrome-front.${PREFIX:-}code-docker-chrome-net"
      FRONT_CDP_UPSTREAM: "chrome-browser:9223"
    networks:
      # code-docker's cdp-bridge unwrap dials chrome-cdp:9223, which is this container now.
      code-docker-internal:
        aliases:
          - chrome-cdp
      chrome-net: {}
    volumes:
      - chrome-front-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Hand the token to the consumer. code-docker's own service has no idea this project
  # exists (that is the point), so without this merge $CHROME_CDP_TOKEN is empty inside
  # the agent container and cdp-bridge unwrap refuses to start - the same failure
  # roblox-studio-docker's overlay merges MCP_TOKEN to avoid.
  code-docker:
    environment:
      CHROME_CDP_TOKEN: "${CHROME_CDP_TOKEN:-}"
      # webmanager shows chrome-front's forward page as a provider page (webmanager's
      # CLAUDE.md has the contract). One variable per provider, so overlays don't clash.
      WEBMANAGER_PROVIDER_CHROME: "Chrome ports|http://chrome-front:8090/"
    volumes:
      # code-docker/install.sh has to run *inside* that container - it uses its mise and
      # its reload-services - but this repo is checked out on the host, outside every
      # path code-docker mounts (builds/ lives beside docker-compose.yml in the deploy
      # directory; /code is the HOME_VOLUME and has no builds/ in it). So the provider
      # hands its own installer over the same way it hands over the token.
      #
      # Read-only, and only the two directories the installer needs: the unit file and
      # the Go source for its offline build path.
      - "./code-docker:/run/code-docker-chrome/code-docker:ro"
      - "./cdp-bridge:/run/code-docker-chrome/cdp-bridge:ro"
      # chrome-ports, the forward table's CLI. The script arrives with ./code-docker above;
      # this fixed launcher is all that's mounted as a file.
      - "./code-docker/chrome-ports-launcher.sh:/usr/local/bin/chrome-ports:ro"

  # Field merge into a service this file does not define - include merging is by service
  # name, already validated in code-docker. router needs to be on chrome-vnc to relay
  # VNC to a person; the actual forward/App Route entry is added at runtime from
  # router-manager, not here. On chrome-net it is the gateway, and dns-local inside
  # Chrome's container finds it by ROUTER_HOSTNAME. Its front door (tcp 80) answers on its
  # outward-facing interface only, so it is no way back into code-server from here.
  code-docker-router:
    networks:
      chrome-vnc: {}
      chrome-net:
        aliases:
          - "${ROUTER_HOSTNAME:-router}"

networks:
  # Chrome's own network: Chrome, chrome-front and router. Egress goes through router's
  # netgate exactly as from code-docker-internal.
  chrome-net:
    internal: true
    name: "${PREFIX:-}code-docker-chrome-net"
    labels:
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
      netinit.gateway: "${PREFIX:-}code-docker-router"
      netinit.exempt-forward: "true"

  chrome-vnc:
    internal: true
    # ${PREFIX} for the same reason code-docker prefixes its own networks: two
    # code-docker instances that both attach this provider must not silently share one
    # network, mixing one deployment's router with the other's browser. Named for the
    # project rather than the alias (chrome-vnc, above) so it reads unambiguously in
    # `docker network ls` next to code-docker's own.
    name: "${PREFIX:-}code-docker-chrome-vnc"
    labels:
      # netinit.provider is what opts this network in to the agent at all - matching is
      # fail-closed, so without it netinit-docker never looks at this network and the
      # exemption below would silently never be applied. netinit.gateway is
      # deliberately absent: this is a relay path to a person, not an egress path, and a
      # network that declares no gateway never becomes one.
      netinit.provider: "${PREFIX:-}code-docker-netinit-docker"
      # Replaces the deprecated NETFILTER_FIX_EXTRA_INTERNAL_NETWORKS entry the user
      # used to have to add to code-docker's own .env - the coupling EXTRA_INCLUDE
      # exists to avoid. The project that needs it declares it.
      netinit.exempt-forward: "true"

volumes:
  chrome-profile:
    name: "${PREFIX:-}code-docker-chrome-profile"
  # chrome-front's forward table (forwards.json), so forwards survive a recreate.
  chrome-front-data:
    name: "${PREFIX:-}code-docker-chrome-front-data"
